name: Trigger Bench Cloud jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        run: |
          curl -sf -X GET "${{ secrets.BENCH_CLOUD_URL }}/api/cron" \
            -H "Authorization: Bearer ${{ secrets.BENCH_CRON_SECRET }}"
